# iOS compile loop + unsigned IPA artifact.
#
# This workflow IS the Xcode for a Linux dev environment: every change
# under ios/ gets typechecked and built here, and the artifact is a
# sideloadable unsigned IPA (AltStore/SideStore re-sign on install).
# macOS runners bill 10x on private repos — triggers are path-filtered
# and concurrency-cancelled to keep the loop bounded.
name: iOS

on:
  workflow_dispatch:
    inputs:
      run_intent_tests:
        description: 'Also run xcodebuild App Intents tests on a simulator'
        type: boolean
        default: false
      run_screenshots:
        description: 'Capture App Store screenshots on a simulator'
        type: boolean
        default: false
  push:
    branches: ['**']
    paths:
      - 'ios/**'
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - '.github/workflows/ios.yml'
    tags: ['ios-v*']

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Fast fail: pure-Swift files typecheck in ~2 min without a Flutter build.
  # AppDelegate/SceneDelegate import Flutter and are excluded — the full
  # build job covers them.
  swift-typecheck:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Show Xcode toolchain
        run: |
          xcodebuild -version
          ls /Applications | grep -i xcode || true
      - name: Typecheck intent sources
        run: |
          cd ios/Runner
          # Files importing Flutter are covered by the full build job.
          FILES=$(ls *.swift | grep -v -e AppDelegate.swift -e SceneDelegate.swift -e AiBridge.swift -e HealthBridge.swift -e ActivityBridge.swift)
          echo "Typechecking: $FILES"
          xcrun swiftc -typecheck \
            -sdk "$(xcrun --show-sdk-path --sdk iphoneos)" \
            -target arm64-apple-ios17.0 \
            $FILES

  build-ipa:
    runs-on: macos-latest
    needs: swift-typecheck
    steps:
      - uses: actions/checkout@v4
      - name: Install Flutter 3.44.6
        run: |
          curl -sSL -o /tmp/flutter.zip \
            https://storage.googleapis.com/flutter_infra_release/releases/stable/macos/flutter_macos_arm64_3.44.6-stable.zip
          unzip -q /tmp/flutter.zip -d "$HOME"
          echo "$HOME/flutter/bin" >> "$GITHUB_PATH"
      - run: flutter --version
      - run: flutter pub get
      - name: Build (unsigned)
        run: flutter build ios --release --no-codesign
      - name: Package unsigned IPA
        run: |
          mkdir -p build/ipa/Payload
          cp -R build/ios/iphoneos/Runner.app build/ipa/Payload/
          cd build/ipa
          zip -qry LifeAssist-unsigned.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: LifeAssist-unsigned-ipa
          path: build/ipa/LifeAssist-unsigned.ipa
          retention-days: 30

  # Exercises the Siri capture contract on a simulator: RunnerTests
  # drives the background App Intents' perform() and asserts the queue
  # records they leave (see ios/RunnerTests/RunnerTests.swift). Runs on
  # every main merge that touches iOS, or on demand via the checkbox.
  intent-tests:
    if: >-
      ${{ (github.event_name == 'workflow_dispatch' && inputs.run_intent_tests)
          || (github.event_name == 'push' && github.ref == 'refs/heads/main') }}
    runs-on: macos-latest
    needs: build-ipa
    steps:
      - uses: actions/checkout@v4
      - name: Install Flutter 3.44.6
        run: |
          curl -sSL -o /tmp/flutter.zip \
            https://storage.googleapis.com/flutter_infra_release/releases/stable/macos/flutter_macos_arm64_3.44.6-stable.zip
          unzip -q /tmp/flutter.zip -d "$HOME"
          echo "$HOME/flutter/bin" >> "$GITHUB_PATH"
      - run: flutter pub get
      - run: flutter build ios --config-only --no-codesign
      - name: Run RunnerTests on a simulator
        run: |
          DEVICE=$(xcrun simctl list devices available | grep -m1 -o 'iPhone [^(]*' | sed 's/ *$//')
          echo "Using simulator: $DEVICE"
          cd ios
          xcodebuild test \
            -workspace Runner.xcworkspace \
            -scheme Runner \
            -destination "platform=iOS Simulator,name=$DEVICE" \
            CODE_SIGNING_ALLOWED=NO

  # Opt-in: boots a big-screen simulator, seeds demo content, and walks
  # the app capturing the six App Store listing shots (see
  # docs/app_store_listing.md). Artifact: AppStoreScreenshots.
  screenshots:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_screenshots }}
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Flutter 3.44.6
        run: |
          curl -sSL -o /tmp/flutter.zip \
            https://storage.googleapis.com/flutter_infra_release/releases/stable/macos/flutter_macos_arm64_3.44.6-stable.zip
          unzip -q /tmp/flutter.zip -d "$HOME"
          echo "$HOME/flutter/bin" >> "$GITHUB_PATH"
      - run: flutter pub get
      - name: Boot the largest available iPhone simulator
        id: sim
        run: |
          # Prefer the Pro Max class for the required 6.9" size.
          DEVICE=$(xcrun simctl list devices available | grep -o 'iPhone [^(]*Pro Max' | tail -1 | sed 's/ *$//')
          if [ -z "$DEVICE" ]; then
            DEVICE=$(xcrun simctl list devices available | grep -m1 -o 'iPhone [^(]*' | sed 's/ *$//')
          fi
          echo "Using simulator: $DEVICE"
          UDID=$(xcrun simctl list devices available | grep "$DEVICE (" | head -1 | grep -o '[0-9A-F-]\{36\}')
          xcrun simctl boot "$UDID"
          # A clean 9:41 status bar for store shots.
          xcrun simctl status_bar "$UDID" override \
            --time "9:41" --batteryState charged --batteryLevel 100 \
            --cellularMode active --cellularBars 4 --wifiBars 3 || true
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"
      - name: Capture screenshots
        run: |
          flutter drive \
            --driver=test_driver/integration_test.dart \
            --target=integration_test/screenshots_test.dart \
            -d "${{ steps.sim.outputs.udid }}"
      - uses: actions/upload-artifact@v4
        with:
          name: AppStoreScreenshots
          path: screenshots/
          retention-days: 30
