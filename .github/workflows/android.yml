# Android APK build — sideload-ready release APKs.
#
# Runs on demand (Actions tab) or when this file / android config
# changes. Two delivery paths: the LifeAssist-apk artifact on the run,
# and a force-pushed single-commit `apk-delivery` branch so tooling can
# fetch the binary over git. Release builds are debug-signed (personal
# sideloading; see android/app/build.gradle.kts).
name: Android

on:
  workflow_dispatch:
  push:
    branches: ['**']
    paths:
      - '.github/workflows/android.yml'
      - 'android/**'

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install Flutter 3.44.6
        run: |
          curl -sSL -o /tmp/flutter.tar.xz \
            https://storage.googleapis.com/flutter_infra_release/releases/stable/linux/flutter_linux_3.44.6-stable.tar.xz
          tar -xJf /tmp/flutter.tar.xz -C "$HOME"
          echo "$HOME/flutter/bin" >> "$GITHUB_PATH"
      - run: flutter --version
      - run: flutter pub get
      - name: Build release APKs (per-ABI + universal)
        run: |
          flutter build apk --release --split-per-abi
          flutter build apk --release
          ls -lh build/app/outputs/flutter-apk/
      - uses: actions/upload-artifact@v4
        with:
          name: LifeAssist-apk
          path: |
            build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
            build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30
      - name: Publish to the apk-delivery branch
        run: |
          mkdir /tmp/delivery
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk \
             /tmp/delivery/LifeAssist-arm64.apk
          cd /tmp/delivery
          git init -b apk-delivery
          git config user.email "actions@github.com"
          git config user.name "github-actions"
          git add -A
          git commit -m "APK build ${GITHUB_SHA::7} ($(date -u +%F))"
          git push -f \
            "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" \
            apk-delivery
