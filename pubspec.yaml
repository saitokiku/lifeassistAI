name: life_dashboard
description: "Life Assist — one quiet place to run your life. The Dart package keeps its original name (life_dashboard) so imports stay stable."
publish_to: "none"
version: 1.0.0+4

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.6.1
  go_router: ^14.6.2
  drift: ^2.20.0
  drift_flutter: ^0.2.0
  path_provider: ^2.1.5
  sqlite3_flutter_libs: ^0.5.24
  intl: ^0.19.0
  uuid: ^4.5.1
  flutter_local_notifications: ^18.0.1
  timezone: ^0.9.4
  flutter_timezone: ^3.0.1
  shared_preferences: ^2.3.3
  fl_chart: ^0.69.0
  share_plus: ^10.1.2
  file_picker: ^8.1.6
  package_info_plus: ^8.1.2
  app_links: ^6.3.2
  local_auth: ^2.3.0
  csv: ^6.0.0
  flutter_markdown: ^0.7.4
  markdown: ^7.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  drift_dev: ^2.20.0
  build_runner: ^2.4.13
  flutter_launcher_icons: ^0.14.1

# The launcher icon: the day-score ring on the console's dark surface.
# Regenerate with `dart run flutter_launcher_icons` after editing the PNGs.
flutter_launcher_icons:
  android: true
  ios: true
  remove_alpha_ios: true
  image_path: assets/icon/app_icon.png
  adaptive_icon_background: "#10141B"
  adaptive_icon_foreground: assets/icon/app_icon_foreground.png

flutter:
  uses-material-design: true

  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.otf
          weight: 400
        - asset: assets/fonts/Inter-Medium.otf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.otf
          weight: 600
        - asset: assets/fonts/Inter-Bold.otf
          weight: 700
    - family: Space Grotesk
      fonts:
        - asset: assets/fonts/SpaceGrotesk-Medium.ttf
          weight: 500
        - asset: assets/fonts/SpaceGrotesk-Bold.ttf
          weight: 700
